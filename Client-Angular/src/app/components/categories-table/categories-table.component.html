<table class="table table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Descripción</th>
    </tr>
  </thead>
  <tbody>
    @for (category of categories; track category.id) {
      <tr>
        <th>{{ category.id }}</th>
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>
      </tr>
    }
  </tbody>
</table>
